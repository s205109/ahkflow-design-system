  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

or-primary-surface);\n    --live-on-primary-surface: var(--color-on-primary-surface);\n    --live-primary-action-bg: var(--color-primary-action-bg);\n    --live-primary-outline-text: var(--color-primary-outline-text);\n    --live-secondary-action-bg: var(--color-secondary-action-bg);\n    --live-tertiary-action-bg: var(--color-tertiary-action-bg);\n    --live-on-accent: var(--color-on-accent);\n    --live-code-surface: var(--color-code-surface);\n  }\n\n  html[data-theme=\"dark\"] {\n    --live-canvas: var(--color-canvas-dark);\n    --live-surface: var(--color-surface-dark);\n    --live-surface-2: var(--color-surface-2-dark);\n    --live-on-surface: var(--color-on-surface-dark);\n    --live-on-surface-muted: var(--color-on-surface-muted-dark);\n    --live-on-surface-faint: var(--color-on-surface-muted-dark);\n    --live-border: var(--color-border-dark);\n    --live-primary: var(--color-primary-dark);\n    --live-primary-surface: color-mix(in srgb, var(--color-primary-dark) 14%, transparent);\n    --live-on-primary-surface: var(--color-primary-lighten);\n    --live-primary-action-bg: var(--color-primary-outline-text-dark);\n    --live-primary-outline-text: var(--color-primary-dark);\n    --live-secondary-action-bg: var(--color-secondary-action-bg-dark);\n    --live-tertiary-action-bg: var(--color-tertiary-action-bg-dark);\n    --live-on-accent: var(--color-on-accent-dark);\n    --live-code-surface: #0F1410;\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: var(--live-canvas);\n    color: var(--live-on-surface);\n    font-family: var(--type-body-family), Helvetica, Arial, sans-serif;\n    font-size: 16px;\n    line-height: 1.5;\n    transition: background 200ms ease, color 200ms ease;\n  }\n  .page { max-width: 1040px; margin: 0 auto; padding: 0 32px 96px; }\n\n  header.top {\n    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;\n    padding: 48px 0 32px; border-bottom: 1px solid var(--live-border);\n  }\n  header.top .titles h1 {\n    font-family: var(--type-display-family); font-size: var(--type-display-size); font-weight: var(--type-display-weight);\n    line-height: var(--type-display-line); letter-spacing: var(--type-display-tracking); margin: 0 0 8px;\n  }\n  header.top .titles p.desc { font-size: var(--type-lead-size); color: var(--live-on-surface-muted); margin: 0 0 6px; max-width: 62ch; }\n  header.top .titles p.mirror-note { font-size: 13px; color: var(--live-on-surface-faint); margin: 0; }\n  header.top .titles p.mirror-note code { font-family: Consolas, monospace; background: var(--live-surface-2); padding: 1px 5px; border-radius: 3px; }\n\n  button.theme-toggle {\n    flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;\n    border-radius: var(--rounded-md); border: 1px solid var(--live-border); background: var(--live-surface);\n    color: var(--live-on-surface); font-family: var(--type-button-family); font-size: var(--type-button-size);\n    font-weight: var(--type-button-weight); cursor: pointer;\n  }\n  button.theme-toggle:hover { background: var(--color-hover-tint); }\n\n  section.block { padding: 56px 0; border-bottom: 1px solid var(--live-border); }\n  section.block:last-of-type { border-bottom: none; }\n  section.block > h2 {\n    font-family: var(--type-section-title-family); font-size: var(--type-section-title-size); font-weight: var(--type-section-title-weight);\n    line-height: var(--type-section-title-line); letter-spacing: var(--type-section-title-tracking); margin: 0 0 6px;\n  }\n  section.block > p.lede { font-size: 14px; color: var(--live-on-surface-faint); margin: 0 0 28px; max-width: 68ch; }\n  h3.subhead {\n    font-family: var(--type-micro-heading-family); font-size: var(--type-micro-heading-size); font-weight: var(--type-micro-heading-weight);\n    letter-spacing: var(--type-micro-heading-tracking); text-transform: uppercase; color: var(--live-on-surface-faint);\n    margin: 0 0 14px;\n  }\n  h3.subhead:not(:first-child) { margin-top: 36px; }\n\n  /* ---- Color swatches ---- */\n  .swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }\n  .swatch { display: flex; flex-direction: column; }\n  .swatch .chip {\n    height: 68px; border-radius: var(--rounded-md); display: flex; align-items: flex-end; padding: 8px 10px;\n    box-sizing: border-box; box-shadow: var(--shadow-1);\n  }\n  .swatch .chip.outline-only { box-shadow: none; border: 1px solid var(--live-border); }\n  .swatch .chip span.sample { font-family: Consolas, monospace; font-size: 12px; }\n  .swatch .name { font-size: 13px; font-weight: 600; margin-top: 8px; }\n  .swatch .hex { font-family: Consolas, monospace; font-size: 11px; color: var(--live-on-surface-faint); }\n\n  /* ---- Typography specimens ---- */\n  .type-row { display: flex; align-items: baseline; gap: 24px; padding: 18px 0; border-top: 1px solid var(--live-border); }\n  .type-row:first-of-type { border-top: none; }\n  .type-row .specimen { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--live-on-surface); }\n  .type-row .meta { flex: none; width: 260px; text-align: right; }\n  .type-row .meta .tok { font-family: Consolas, monospace; font-size: 12px; font-weight: 600; color: var(--live-on-surface); }\n  .type-row .meta .spec { font-family: Consolas, monospace; font-size: 11px; color: var(--live-on-surface-faint); line-height: 1.6; }\n\n  /* ---- Spacing bars ---- */\n  .space-row { display: flex; align-items: center; gap: 16px; padding: 8px 0; }\n  .space-row .bar { height: 18px; background: var(--live-primary); border-radius: 3px; flex: none; }\n  .space-row .tok { font-family: Consolas, monospace; font-size: 12px; width: 170px; flex: none; }\n  .space-row .val { font-family: Consolas, monospace; font-size: 12px; color: var(--live-on-surface-faint); }\n  .space-table { width: 100%; border-collapse: collapse; margin-top: 8px; }\n  .space-table td { padding: 8px 0; border-top: 1px solid var(--live-border); font-size: 13px; }\n  .space-table td.tok { font-family: Consolas, monospace; font-weight: 600; width: 220px; }\n  .space-table td.val { font-family: Consolas, monospace; color: var(--live-on-surface-faint); }\n\n  /* ---- Radius ---- */\n  .radius-grid { display: flex; gap: 28px; flex-wrap: wrap; }\n  .radius-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }\n  .radius-box { width: 84px; height: 84px; background: var(--live-primary-surface); border: 1px solid var(--color-border-green); }\n  .radius-item .tok { font-family: Consolas, monospace; font-size: 12px; }\n  .radius-item .val { font-family: Consolas, monospace; font-size: 11px; color: var(--live-on-surface-faint); }\n\n  /* ---- Elevation ---- */\n  .elevation-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px; }\n  .elevation-card {\n    height: 96px; border-radius: var(--rounded-md); background: var(--live-surface);\n    display: flex; align-items: flex-end; padding: 12px;\n  }\n  .elevation-card .tok { font-family: Consolas, monospace; font-size: 12px; font-weight: 600; }\n\n  /* ---- Components ---- */\n  .comp-grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }\n  .comp-item { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }\n  .comp-item .label { font-family: Consolas, monospace; font-size: 11px; color: var(--live-on-surface-faint); }\n\n  .btn {\n    font-family: var(--type-button-family); font-size: var(--type-button-size); font-weight: var(--type-button-weight);\n    letter-spacing: var(--type-button-tracking); border-radius: var(--rounded-md); padding: 6px 16px; height: 36px;\n    border: none; cursor: default; display: inline-flex; align-items: center;\n  }\n  .btn-primary { background: var(--live-primary-action-bg); color: var(--live-on-accent); }\n  .btn-primary.hover { background: var(--color-primary-darken); }\n  .btn-outlined { background: transparent; color: var(--live-primary-outline-text); border: 1px solid currentColor; }\n  .btn-outlined.hover { background: var(--color-hover-tint); }\n  .btn-destructive { background: var(--live-tertiary-action-bg); color: var(--live-on-accent); }\n  .btn-destructive.hover { background: var(--color-tertiary-darken); }\n  .icon-btn {\n    width: 36px; height: 36px; border-radius: var(--rounded-full); background: transparent;\n    color: var(--live-on-surface-muted); border: 1px solid var(--live-border);\n    display: flex; align-items: center; justify-content: center; font-size: 18px;\n  }\n\n  .field {\n    background: var(--live-surface); color: var(--live-on-surface); border-radius: var(--rounded-md);\n    padding: 8px 12px; height: 40px; border: 1px solid var(--live-border); font-size: var(--type-body-small-size);\n    display: flex; align-items: center; width: 200px;\n  }\n  .field.focus { border-color: var(--color-focus-ring); box-shadow: 0 0 0 2px var(--live-canvas), 0 0 0 4px var(--color-focus-ring); }\n\n  .chip-soft {\n    background: var(--live-primary-surface); color: var(--live-on-primary-surface); border-radius: var(--rounded-full);\n    padding: 2px 10px; height: 24px; font-size: var(--type-caption-size); display: inline-flex; align-items: center;\n  }\n  .chip-selected { background: var(--live-primary-action-bg); color: var(--live-on-accent); }\n\n  .card-demo {\n    background: var(--live-surface); color: var(--live-on-surface); border-radius: var(--rounded-md);\n    padding: var(--space-panel-padding); box-shadow: var(--shadow-1); width: 220px; font-size: 14px;\n  }\n  .dialog-demo {\n    background: var(--live-surface); border-radius: var(--rounded-lg); padding: var(--space-lg);\n    box-shadow: var(--shadow-4); width: 260px; font-size: 14px;\n  }\n\n  .table-demo { border-collapse: collapse; width: 320px; }\n  .table-demo th {\n    background: var(--live-surface); color: var(--live-on-surface-faint); font-size: var(--type-label-size);\n    font-weight: var(--type-label-weight); letter-spacing: var(--type-label-tracking); text-transform: uppercase;\n    text-align: left; height: 40px; padding: 0 12px; border-bottom: 1px solid var(--live-border);\n  }\n  .table-demo td {\n    background: var(--live-surface); color: var(--live-on-surface); font-size: var(--type-body-small-size);\n    height: 36px; padding: 0 12px; border-bottom: 1px solid var(--live-border);\n  }\n  .table-demo tr.hover td { background: var(--color-hover-tint); }\n\n  .appbar-demo {\n    width: 100%; max-width: 420px; height: var(--space-appbar-height); background: var(--live-primary-surface);\n    color: var(--live-on-primary-surface); display: flex; align-items: center; padding: 0 16px;\n    font-family: var(--type-panel-title-family); font-size: var(--type-panel-title-size); font-weight: var(--type-panel-title-weight);\n    border-radius: var(--rounded-md);\n  }\n  .nav-item-demo {\n    background: var(--live-primary-surface); color: var(--live-on-primary-surface); border-radius: var(--rounded-md);\n    padding: 8px 14px; font-size: var(--type-body-small-medium-size); font-weight: var(--type-body-small-medium-weight);\n    display: inline-flex; align-items: center;\n  }\n\n  .code-block-demo {\n    background: var(--live-code-surface); color: var(--live-on-surface); border-radius: var(--rounded-md);\n    padding: 16px 18px; border: 1px solid var(--live-border); font-family: Consolas, monospace;\n    font-size: var(--type-code-block-size); line-height: var(--type-code-block-line); width: 320px; white-space: pre;\n  }\n  .keycap-row { display: flex; gap: 6px; align-items: center; }\n  .keycap {\n    background: var(--live-surface); color: var(--live-on-surface); border-radius: var(--rounded-md);\n    padding: 1px 7px; font-family: Consolas, monospace; font-size: 12px; border: 1px solid var(--color-border-strong);\n    box-shadow: 0 1px 0 var(--color-border-strong);\n  }\n\n alog<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\">Data grids &amp; tables<\u002Fh3>\n    <div class=\"comp-grid\">\n      <table class=\"table-demo\">\n        <tbody><tr><th>Trigger<\u002Fth><th>Replacement<\u002Fth><\u002Ftr>\n        <tr><td>;addr<\u002Ftd><td>123 Main St<\u002Ftd><\u002Ftr>\n        <tr class=\"hover\"><td>;sig<\u002Ftd><td>Sam Rivers<\u002Ftd><\u002Ftr>\n      <\u002Ftbody><\u002Ftable>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\">Navigation<\u002Fh3>\n    <div class=\"comp-grid\">\n      <div class=\"comp-item\"><div class=\"appbar-demo\">AHKFlow<\u002Fdiv><div class=\"label\">app-bar<\u002Fdiv><\u002Fdiv>\n      <div class=\"comp-item\"><div class=\"nav-item-demo\">Hotstrings<\u002Fdiv><div class=\"label\">nav-item-active<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\">Code &amp; keycaps<\u002Fh3>\n    <div class=\"comp-grid\">\n      <div class=\"comp-item\"><div class=\"code-block-demo\">ahkflow build --profile work\n::addr::123 Main St 0<\u002Fdiv><div class=\"label\">code-block<\u002Fdiv><\u002Fdiv>\n      <div class=\"comp-item\"><div class=\"keycap-row\"><span class=\"keycap\">Ctrl<\u002Fspan><span class=\"keycap\">Alt<\u002Fspan><span class=\"keycap\">S<\u002Fspan><\u002Fdiv><div class=\"label\">keycap<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================= VOICE & TONE ============================= -->\n  <section class=\"block\" id=\"voice-tone\">\n    <h2>Voice &amp; tone<\u002Fh2>\n    <p class=\"lede\">Calm, utilitarian, concise — a tool for experienced daily users, never marketing.<\u002Fp>\n\n    <h3 class=\"subhead\">Voice &amp; person<\u002Fh3>\n    <ul class=\"voice-list\">\n      <li><strong>Voice:<\u002Fstrong> plain, direct, operational. No hype, no exclamation, no hand-holding for obvious controls, e.g. \"Define them once, organize them by profile, and download a valid <code>.ahk<\u002Fcode> script.\"<\u002Fli>\n      <li><strong>Person:<\u002Fstrong> addresses the user as <strong>“you”<\u002Fstrong> (“Manage your AutoHotkey hotstrings…”); the product refers to itself as <strong>AHKFlow<\u002Fstrong> (product) / <code>AHKFlowApp<\u002Fcode> (solution).<\u002Fli>\n      <li><strong>Casing:<\u002Fstrong> sentence case for body, labels, and buttons (<code>text-transform: none<\u002Fcode>: \"Add\", \"Reload\", \"Delete 3 selected\"). Column headers, field labels, and eyebrows are UPPERCASE, the label/overline role (see Typography).<\u002Fli>\n    <\u002Ful>\n\n    <h3 class=\"subhead\">Microcopy patterns (verbatim from the app)<\u002Fh3>\n    <ul class=\"voice-list\">\n      <li><strong>Toasts:<\u002Fstrong> short past-tense confirmations, e.g. \"Hotstring created.\" · \"Hotstring updated.\" · \"Settings saved.\"<\u002Fli>\n      <li><strong>Search placeholder:<\u002Fstrong> \"Search For Hotstrings\".<\u002Fli>\n      <li><strong>Destructive confirm:<\u002Fstrong> title \"Delete hotstring?\", body <code>Delete \"{trigger}\"? This cannot be undone.<\u002Fcode>, confirm button \"Delete\".<\u002Fli>\n      <li><strong>Empty states, truly empty:<\u002Fstrong> \"No hotstrings yet. Add one to get started.\" · \"No categories yet. Add one to get started.\" · \"No profiles yet. Add one to get started.\"<\u002Fli>\n      <li><strong>Empty states, filtered:<\u002Fstrong> \"No hotstrings match your search.\" · \"No hotstrings match the active filters.\" · <code>No profiles match \"{search}\".<\u002Fcode> · \"No categories in this scope.\"<\u002Fli>\n      <li><strong>Bulk delete:<\u002Fstrong> button \"Delete {n} selected\"; confirm body \"Delete {n} hotstrings? This cannot be undone.\" (properly pluralized, never \"(s)\").<\u002Fli>\n      <li><strong>Blocked action:<\u002Fstrong> name the rule, then the remedy: \"Can't delete the default profile. Set another as default first.\" Warning severity, raised on activation (see Do's and Don'ts).<\u002Fli>\n      <li><strong>Validation:<\u002Fstrong> \"Trigger is required\" · \"Replacement is required\" · \"Name is required\".<\u002Fli>\n      <li><strong>Not-signed-in:<\u002Fstrong> \"You are not signed in.\" Always <strong>info<\u002Fstrong> severity (a fact, not a failure), with the Log in remedy inline. Warning is reserved for \"Your session expired. Log in again to continue.\", error for a failed sign-in only.<\u002Fli>\n      <li><strong>Slogan (final):<\u002Fstrong> <strong>\"AutoHotkey V2 hotstring manager &amp; CLI.\"<\u002Fstrong><\u002Fli>\n      <li><strong>Punctuation:<\u002Fstrong> no em dashes in UI copy; use commas, colons, semicolons, or periods. The \"—\" glyph may appear only as an empty-cell data placeholder.<\u002Fli>\n    <\u002Ful>\n\n    <h3 class=\"subhead\">Signed-out states<\u002Fh3>\n    <ul class=\"voice-list\">\n      <li><strong>Chrome stays:<\u002Fstrong> nav rail, app bar, and page titles always render; a signed-out user can explore the full layout.<\u002Fli>\n      <li><strong>Data pages gate:<\u002Fstrong> Hotstrings, Hotkeys, Downloads, Profiles, Categories, and Settings replace their body with the <code>SignInGate<\u002Fcode>: icon ring, \"You are not signed in.\", one sentence of what signing in unlocks, and a filled Log in button. Never disabled toolbars or fake-empty grids; \"No hotstrings yet.\" is a lie when the truth is \"we don't know\". Settings gates because its preferences are account-scoped (theme is persisted server-side).<\u002Fli>\n      <li><strong>Home never gates:<\u002Fstrong> hero + CLI quickstart stay; an info alert with an inline Log in action appears, and stat values render the \"—\" placeholder, never a false 0.<\u002Fli>\n      <li><strong>App-bar auth chrome:<\u002Fstrong> signed out = outlined Log in button; signed in = greeting + initials avatar opening the account menu (name/email, Settings, Sign out).<\u002Fli>\n      <li><strong>Feedback:<\u002Fstrong> signing in shows a full-canvas centered progress with \"Signing you in…\"; sign-in/out confirm with success toasts (\"Signed in as ….\" / \"Signed out.\").<\u002Fli>\n    <\u002Ful>\n\n    <h3 class=\"subhead\">Errors, color &amp; emoji<\u002Fh3>\n    <ul class=\"voice-list\">\n      <li><strong>Errors:<\u002Fstrong> backend returns RFC 9457 ProblemDetails, rendered as <code>title<\u002Fcode> + <code>detail<\u002Fcode> cleanly. Field-level validation is inline on the input after a commit attempt; request-level errors go to a Snackbar or an inline alert.<\u002Fli>\n      <li><strong>Destructive color:<\u002Fstrong> follows the same user-chose vs. system-reported split as Colors: copper for buttons the user picks, bright red only for errors the system reports.<\u002Fli>\n      <li><strong>Emoji:<\u002Fstrong> not used in product chrome. Unicode glyphs appear only as content (e.g. the <code>→<\u002Fcode> in a hotstring replacement, the <code>&gt;<\u002Fcode>/<code>_<\u002Fcode> prompt in the logo).<\u002Fli>\n      <li><strong>Sample data:<\u002Fstrong> mockups use neutral, clearly-fake placeholders (\"Sam Rivers\", <code>sam@example.com<\u002Fcode>), never real user data.<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- ============================= ACCESSIBILITY CONTRACT ============================= -->\n  <section class=\"block\" id=\"accessibility-contract\">\n    <h2>Accessibility contract<\u002Fh2>\n    <p class=\"lede\">WCAG 2.2 AA is the committed floor. The React design-system kit is a <em>visual specification<\u002Fem>; full keyboard and assistive-technology support ships in the MudBlazor Blazor app before release (MudBlazor components provide native keyboard operability, roles, and focus management). This is the contract the app implementation must satisfy, and the kit follows where cheap.<\u002Fp>\n    <ul class=\"voice-list\">\n      <li><strong>Contrast:<\u002Fstrong> ≥4.5:1 body/small text, ≥3:1 large text and UI components, in <strong>both<\u002Fstrong> themes. Use the action tones and on-fill inks from Colors; never raw brand hues under light text.<\u002Fli>\n      <li><strong>Focus:<\u002Fstrong> every interactive element shows the flow-blue focus ring on <code>:focus-visible<\u002Fcode> (<code>0 0 0 2px canvas, 0 0 0 4px #3B8FC2<\u002Fcode>). Never suppress <code>outline<\u002Fcode> without applying the ring; one shared rule in the tokens applies it globally.<\u002Fli>\n      <li><strong>Names:<\u002Fstrong> icon-only buttons always carry an <code>aria-label<\u002Fcode> (and a tooltip); a decorative tooltip never substitutes for an accessible name.<\u002Fli>\n      <li><strong>Controls:<\u002Fstrong> interactive elements are native <code>&lt;button&gt;<\u002Fcode>/<code>&lt;input&gt;<\u002Fcode>/<code>&lt;select&gt;<\u002Fcode> or carry the full ARIA pattern (role, state, <code>tabindex<\u002Fcode>, keyboard handlers). Checkboxes, switches, radios, selects, sortable headers (<code>aria-sort<\u002Fcode>), and facet rows must be keyboard-operable.<\u002Fli>\n      <li><strong>Overlays:<\u002Fstrong> dialogs trap focus, close on Escape, and return focus to the trigger; popovers and menus close on Escape; triggers expose <code>aria-expanded<\u002Fcode>.<\u002Fli>\n      <li><strong>Structure:<\u002Fstrong> real headings (<code>&lt;h1&gt;<\u002Fcode>–<code>&lt;h3&gt;<\u002Fcode>) behind the title roles; nav landmarks with <code>aria-label<\u002Fcode> and <code>aria-current<\u002Fcode>; toast live-region mounted persistently; progress elements carry <code>progressbar<\u002Fcode> semantics.<\u002Fli>\n      <li><strong>Motion:<\u002Fstrong> <code>prefers-reduced-motion<\u002Fcode> collapses all durations (implemented in tokens).<\u002Fli>\n      <li><strong>Touch:<\u002Fstrong> ≥44px hit targets on coarse pointers (the <code>.ahk-hit<\u002Fcode> helper expands smaller icon controls).<\u002Fli>\n      <li><strong>Text:<\u002Fstrong> never below the 12px floor; editable inputs ≥16px on mobile (iOS zoom).<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- ============================= DO'S AND DON'TS ============================= -->\n  <section class=\"block\" id=\"dos-donts\">\n    <h2>Do's and Don'ts<\u002Fh2>\n    <div class=\"dd-grid\">\n      <div class=\"dd-col do\">\n        <h3>Do<\u002Fh3>\n        <ul>\n          <li>Use copper for user-chosen destructive actions and bright red only for system-reported errors — never swap them.<\u002Fli>\n          <li>Set grids, counts, and timestamps in tabular figures, and all code with slashed zeros.<\u002Fli>\n          <li>Keep body-small (14px) as the data workhorse; never drop content below 12px, and never set prose below 16px.<\u002Fli>\n          <li>Use the elevation ramp (0/1/2/4/8) or a 1px border for depth — never arbitrary box-shadows.<\u002Fli>\n          <li>Use the darker \"action\" tone (not the raw brand swatch) for filled-button text/backgrounds — the raw swatch fails WCAG AA at button sizes.<\u002Fli>\n          <li>Use the brand asset files for the logo/wordmark — never re-typeset it from a font.<\u002Fli>\n          <li>Write sentence case everywhere, UPPERCASE only for the label/overline role.<\u002Fli>\n          <li>Give every interactive element the flow-blue <code>:focus-visible<\u002Fcode> ring — never suppress outline without it.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dd-col dont\">\n        <h3>Don't<\u002Fh3>\n        <ul>\n          <li>Build a stat-card dashboard. The <code>metric<\u002Fcode> type role sets a large number; it does not sanction a grid of identical metric cards, which PRODUCT.md anti-references as the SaaS-dashboard cliché. A count may appear only when it's live, traceable to a record set the user can open, and secondary to the page's real content. Never invent a number, a timestamp, or an activity feed to fill a landing page.<\u002Fli>\n          <li>Disable a control whose only explanation is a tooltip — <code>disabled<\u002Fcode> carries <code>pointer-events: none<\u002Fcode>, so the tooltip never reaches a pointer user (screen readers still read the <code>aria-label<\u002Fcode>, leaving the sighted mouse user stranded). When a rule blocks an action, keep the control enabled and explain on activation with a warning toast naming the rule and the remedy. Model: the Categories orphan-guard.<\u002Fli>\n          <li>Use pure white text on dark surfaces — ink is off-white #E6E9E4 (this includes text on filled buttons: dark on-accent is #E6E9E4).<\u002Fli>\n          <li>Use gradients, photographic backgrounds, textures, glassmorphism, or backdrop blur.<\u002Fli>\n          <li>Use emoji in product chrome; Unicode glyphs appear only as user content.<\u002Fli>\n          <li>Add bounce or infinite decorative animation; motion stays 120–300ms and eased.<\u002Fli>\n          <li>Invent new green tints — layer <code>primary-surface<\u002Fcode>, <code>on-primary-surface<\u002Fcode>, and <code>border-green<\u002Fcode> instead.<\u002Fli>\n          <li>Let the primary green appear as more than one filled CTA per toolbar; secondary actions are outlined or text.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<script>\n  (function () {\n    var root = document.documentElement;\n    var btn = document.getElementById('themeToggle');\n    var stored = localStorage.getItem('ahkflow-design-theme');\n    if (stored === 'dark') {\n      root.setAttribute('data-theme', 'dark');\n      btn.textContent = '☀️ Light mode';\n    }\n    btn.addEventListener('click', function () {\n      var isDark = root.getAttribute('data-theme') === 'dark';\n      if (isDark) {\n        root.removeAttribute('data-theme');\n        btn.textContent = '🌙 Dark mode';\n        localStorage.setItem('ahkflow-design-theme', 'light');\n      } else {\n        root.setAttribute('data-theme', 'dark');\n        btn.textContent = '☀️ Light mode';\n        localStorage.setItem('ahkflow-design-theme', 'dark');\n      }\n    });\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
